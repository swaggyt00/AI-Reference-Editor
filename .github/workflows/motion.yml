name: Motion compositor smoke test
on:
  push:
    paths:
      - 'motion/**'
      - 'refeditor/motion.py'
      - '.github/workflows/motion.yml'
  pull_request:
    paths:
      - 'motion/**'
      - 'refeditor/motion.py'
      - '.github/workflows/motion.yml'
jobs:
  motion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned motion renderer
        working-directory: motion
        run: npm install --no-audit --no-fund
      - name: Render real animated test frame
        working-directory: motion
        run: ./node_modules/.bin/remotion still src/index.jsx Motion /tmp/motion.png --frame 30 --props demo-props.json --width 540 --height 960 --public-license-key free-license
      - name: Validate output
        run: file /tmp/motion.png && test -s /tmp/motion.png
